<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0D133D;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .circle-outer {
    width: 60%;
    height: 60%;
    background: #FF3D7F;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 40px rgba(255, 61, 127, 0.5);
  }
  .circle-inner {
    width: 50%;
    height: 50%;
    background: #2EE6B6;
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(46, 230, 182, 0.7);
  }
</style>
</head>
<body>
  <div class="circle-outer">
    <div class="circle-inner"></div>
  </div>
</body>
</html>
